<!--
  Migration fixture: Button + Card
  v1 markup (left) vs v2 markup (right) after codemod.
  Used by browser tests to verify visual equivalence.
-->
<div class="blora-scope" style="display: flex; gap: 2rem; flex-wrap: wrap">
  <!-- v1 markup (before codemod) -->
  <div id="v1">
    <div class="blora-card blora-card--hover" style="margin-bottom: 1rem">
      <div class="blora-card__title">v1 Card</div>
      <div class="blora-card__body">This uses 1.x class names.</div>
      <div class="blora-card__foot">
        <button class="blora-btn blora-btn--primary" type="button">Primary</button>
        <button class="blora-btn blora-btn--ghost" type="button">Ghost</button>
        <button class="blora-btn blora-btn--sm" type="button">Small</button>
      </div>
    </div>
  </div>

  <!-- v2 markup (after codemod) -->
  <div id="v2">
    <div class="blora-card" data-variant="hover" style="margin-bottom: 1rem">
      <div class="blora-card__title">v2 Card</div>
      <div class="blora-card__body">This uses 2.0 class names and data attributes.</div>
      <div class="blora-card__foot">
        <button class="blora-button" data-variant="primary" type="button">Primary</button>
        <button class="blora-button" data-variant="ghost" type="button">Ghost</button>
        <button class="blora-button" data-size="sm" type="button">Small</button>
      </div>
    </div>
  </div>
</div>
