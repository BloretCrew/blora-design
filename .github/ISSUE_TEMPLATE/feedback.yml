name: Beta feedback
description: Questions, API feedback, or migration notes for 2.0 Beta
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for non-bug input while **2.0 is in Beta**. Stable-core API is frozen; beta contracts may still change with migration notes.
        Docs: `docs/guide.md` · Progress: `docs/refactor/remaining-work.md`
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - API / ergonomics
        - Docs / migration
        - Visual / a11y
        - Add-on
        - Other
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Feedback
    validations:
      required: true
