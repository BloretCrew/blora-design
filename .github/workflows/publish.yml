# Push a version tag (e.g. v2.0.0-alpha.1) to publish the monorepo packages.
#
# Trigger: git push origin v2.0.0-alpha.1
# Secret: NPM_TOKEN (npm Automation token with publish rights for @bloret-crew)
#
# Version source of truth: packages/blora-design/package.json
# Tag must match that version (v prefix stripped).
# Prerelease versions (alpha|beta|rc) publish with matching npm dist-tag; stable uses latest.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Enable when publishing with npm provenance (OIDC)
  id-token: write

env:
  PNPM_VERSION: "10.33.0"
  NODE_VERSION: "22"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          scope: "@bloret-crew"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CORE="packages/blora-design/package.json"
          PKG="$(node -p "require('./${CORE}').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG must match packages/blora-design version ($PKG)."
            exit 1
          fi

          # All publishable workspace packages must share the same version.
          for pkg in packages/blora-design/package.json addons/*/package.json; do
            V="$(node -p "require('./${pkg}').version")"
            PRIV="$(node -p "String(!!require('./${pkg}').private)")"
            if [ "$PRIV" = "true" ]; then
              continue
            fi
            if [ "$V" != "$PKG" ]; then
              echo "::error::Version mismatch: $pkg is $V, expected $PKG"
              exit 1
            fi
          done

          DIST_TAG="latest"
          if [[ "$PKG" == *"-alpha"* ]]; then DIST_TAG="alpha"
          elif [[ "$PKG" == *"-beta"* ]]; then DIST_TAG="beta"
          elif [[ "$PKG" == *"-rc"* ]]; then DIST_TAG="rc"
          fi

          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing Blora Design $PKG (git $GITHUB_REF_NAME, npm tag $DIST_TAG)"

      - name: Build
        run: pnpm build

      - name: Package gates (publint + attw)
        run: |
          pnpm publint
          pnpm attw

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.dist_tag }}"
          # Core first, then add-ons (depend on published core for consumers; order is documentation-friendly).
          # Provenance is opt-in (set repo var NPM_PROVENANCE=1 + npm trusted publishing).
          PUBLISH_FLAGS=(--access public --tag "$TAG" --no-git-checks)
          if [ "${{ vars.NPM_PROVENANCE }}" = "1" ]; then
            PUBLISH_FLAGS+=(--provenance)
          fi
          pnpm --filter @bloret-crew/blora-design publish "${PUBLISH_FLAGS[@]}"
          for filter in \
            @bloret-crew/blora-design-markdown \
            @bloret-crew/blora-design-thread \
            @bloret-crew/blora-design-qrcode \
            @bloret-crew/blora-design-effects \
            @bloret-crew/blora-design-layout \
            @bloret-crew/blora-design-theming
          do
            pnpm --filter "$filter" publish "${PUBLISH_FLAGS[@]}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Blora Design ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install (2.0 ESM)

            ```bash
            pnpm add @bloret-crew/blora-design@${{ steps.ver.outputs.version }}
            # or track prereleases:
            # pnpm add @bloret-crew/blora-design@${{ steps.ver.outputs.dist_tag }}
            ```

            ```js
            import "@bloret-crew/blora-design/tokens.css";
            import "@bloret-crew/blora-design/foundations.css";
            import { toast, createTableController, defineBloraSelect } from "@bloret-crew/blora-design";
            ```

            Optional add-ons: `@bloret-crew/blora-design-markdown`, `-thread`, `-qrcode`, `-effects`, `-layout`, `-theming`.

            npm dist-tag for this release: **`${{ steps.ver.outputs.dist_tag }}`**

            - Docs: `docs/guide.md`
            - Progress: `docs/refactor/remaining-work.md`
            - License: Apache-2.0

            ---

            ### Changelog

            (GitHub auto-generated notes below)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
