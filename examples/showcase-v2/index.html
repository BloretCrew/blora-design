<!doctype html>
<html lang="zh-CN" data-blora-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7f8" />
    <title>Accordion · Blora Design Components</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("blora-color-scheme");
          const preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.bloraColorScheme = saved || preferred;
        } catch {
          document.documentElement.dataset.bloraColorScheme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="../../packages/blora-design/dist/blora.css" />
    <link rel="stylesheet" href="../../packages/blora-design/dist/tokens.dark.css" />
    <link rel="stylesheet" href="../../packages/blora-design/dist/tokens.themes.css" />
    <link rel="stylesheet" href="../../addons/theming/dist/theming.css" />
    <link rel="stylesheet" href="../../addons/layout/dist/layout.css" />
    <link rel="stylesheet" href="../../addons/effects/dist/effects.css" />
    <link rel="stylesheet" href="../../addons/markdown/dist/markdown.css" />
    <link rel="stylesheet" href="../../addons/qrcode/dist/qrcode.css" />
    <link rel="stylesheet" href="../../addons/thread/dist/thread.css" />
    <style>
      :root {
        --showcase-navbar-offset: 6rem;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-padding-top: var(--showcase-navbar-offset);
      }

      body {
        min-width: 20rem;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      /* Showcase owns only page composition. Visual component chrome comes
         from the official Navbar, Layout, Tabs, Badge and Button CSS above. */
      .showcase-navbar {
        z-index: var(--blora-z-sticky);
      }

      .showcase-catalog {
        --blora-sidebar-width: 15rem;
        --blora-sidebar-min-height: calc(100dvh - var(--showcase-navbar-offset));
        --blora-sidebar-aside-padding: 0 var(--blora-space-5) var(--blora-space-6) 0;
        --blora-sidebar-aside-background: transparent;
        --blora-sidebar-content-padding: 0 0 var(--blora-space-12)
          clamp(var(--blora-space-7), 5vw, var(--blora-space-12));
        --blora-sidebar-sticky-offset: var(--showcase-navbar-offset);
        --blora-sidebar-sticky-height: calc(
          100dvh - var(--showcase-navbar-offset) - var(--blora-space-5)
        );
        --blora-sidebar-drawer-aside-padding: var(--blora-space-5);
        --blora-sidebar-drawer-content-padding: var(--blora-space-4) var(--blora-space-5)
          var(--blora-space-10);
        --blora-sidebar-toggle-min-height: 2.75rem;

        width: min(90rem, calc(100% - var(--blora-space-8)));
        margin: var(--blora-space-6) auto var(--blora-space-12);
      }

      #component-sidebar {
        overflow-anchor: none;
      }

      .showcase-sidebar-title {
        margin: 0;
      }

      .showcase-sidebar-title {
        padding: var(--blora-space-3) var(--blora-space-3) var(--blora-space-5);
        color: var(--blora-color-text-muted);
        font-family: var(--blora-font-heading);
        font-size: var(--blora-text-sm);
        font-weight: 600;
      }

      .showcase-panel[hidden] {
        display: none;
      }

      .showcase-preview-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--blora-space-4);
      }

      .showcase-textfx-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--blora-space-4);
      }

      .showcase-textfx-list > [data-blora-text-fx] {
        width: 100%;
        min-height: 2.6rem;
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
        background: var(--blora-color-surface-raised);
        padding: var(--blora-space-2) var(--blora-space-3);
      }

      .showcase-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: var(--blora-space-6);
        padding: var(--blora-space-7) 0 var(--blora-space-8);
        border-bottom: 1px solid var(--blora-color-border-subtle);
      }

      .showcase-heading__eyebrow {
        margin: 0 0 var(--blora-space-2);
        color: var(--blora-color-action-primary-default);
        font-family: var(--blora-font-mono);
        font-size: var(--blora-text-xs);
        font-weight: 600;
        letter-spacing: var(--blora-tracking-caps);
        text-transform: uppercase;
      }

      .showcase-heading h1 {
        width: fit-content;
        max-width: 100%;
        margin: 0;
        color: var(--blora-color-text-primary);
        font-family: var(--blora-font-heading);
        font-size: clamp(var(--blora-text-3xl), 4vw, var(--blora-text-4xl));
        line-height: var(--blora-leading-tight);
      }

      .showcase-heading h1:focus-visible {
        margin: calc(-1 * var(--blora-space-1)) calc(-1 * var(--blora-space-2));
        padding: var(--blora-space-1) var(--blora-space-2);
        border-radius: var(--blora-radius-sm);
        outline: var(--blora-focus-ring-width-strong) solid
          var(--blora-color-action-primary-default);
        outline-offset: var(--blora-space-1);
        box-shadow: none;
      }

      .showcase-heading__description {
        max-width: 42rem;
        margin: var(--blora-space-3) 0 0;
        color: var(--blora-color-text-muted);
        line-height: var(--blora-leading-loose);
      }

      .showcase-heading > .blora-badge {
        width: max-content;
      }

      .showcase-section {
        padding-block: var(--blora-space-9);
      }

      .showcase-section + .showcase-section {
        border-top: 1px solid var(--blora-color-border-subtle);
      }

      .showcase-section h2 {
        margin: 0 0 var(--blora-space-4);
        color: var(--blora-color-text-primary);
        font-family: var(--blora-font-heading);
        font-size: var(--blora-text-xl);
      }

      .showcase-section__description {
        margin: calc(var(--blora-space-3) * -1) 0 var(--blora-space-5);
        color: var(--blora-color-text-muted);
      }

      .showcase-example {
        overflow: clip;
        background: var(--blora-color-surface-default);
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
        box-shadow: var(--blora-shadow-1);
      }

      .showcase-preview,
      .showcase-code-panel {
        padding: clamp(var(--blora-space-5), 4vw, var(--blora-space-8));
        background: var(--blora-color-surface-canvas);
      }

      .showcase-preview {
        display: grid;
        min-height: 18rem;
        place-items: start center;
        transition: min-height var(--blora-duration-base) var(--blora-easing-standard);
      }

      .showcase-preview > * {
        width: min(40rem, 100%);
        min-width: 0;
      }

      .showcase-preview:has([data-showcase-addon-layout]) {
        place-items: start stretch;
      }

      .showcase-preview > [data-showcase-addon-layout] {
        width: 100%;
      }

      .showcase-preview:has([data-showcase-addon-thread]) {
        place-items: start stretch;
      }

      .showcase-preview > [data-showcase-addon-thread] {
        width: min(48rem, 100%);
      }

      [data-showcase-row] {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--blora-space-3);
      }

      [data-showcase-stack] {
        display: grid;
        gap: var(--blora-space-4);
      }

      [data-showcase-center] {
        display: grid;
        place-items: center;
      }

      [data-showcase-grid] {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: var(--blora-space-4);
      }

      [data-showcase-mockup-stage] {
        display: grid;
        justify-items: center;
        min-width: 0;
        padding: var(--blora-space-6);
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
        background: var(--blora-color-surface-raised);
      }

      [data-showcase-mockup-stage] > blora-mockup:not([variant="phone"]) {
        width: 100%;
      }

      [data-showcase-mockup-stage] > blora-mockup[variant="phone"] {
        width: min(100%, 15.5rem);
      }

      [data-showcase-cases] {
        display: grid;
        gap: var(--blora-space-8);
        width: 100%;
      }

      [data-showcase-case] {
        display: grid;
        gap: var(--blora-space-4);
        min-width: 0;
      }

      [data-showcase-case] > h3 {
        margin: 0;
        color: var(--blora-color-text-primary);
        font-family: var(--blora-font-heading);
        font-size: var(--blora-text-md);
      }

      [data-showcase-case="WithBadge"] {
        justify-items: start;
      }

      .showcase-fx-surface,
      [data-showcase-effect-surface] {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, var(--blora-color-action-primary-default), var(--blora-color-status-info));
      }

      .showcase-fx-surface[data-tone="success"],
      [data-showcase-effect-surface="success"] {
        background: linear-gradient(135deg, var(--blora-color-status-success), var(--blora-color-surface-sunken));
      }

      .showcase-fx-surface[data-tone="info"],
      [data-showcase-effect-surface="info"] {
        background: linear-gradient(135deg, var(--blora-color-status-info), var(--blora-color-status-warning));
      }

      [data-showcase-image-diff],
      [data-showcase-hover-gallery] {
        width: min(28rem, 100%);
      }

      [data-showcase-anchor-layout] {
        display: grid;
        grid-template-columns: 9rem minmax(0, 1fr);
        gap: var(--blora-space-6);
        align-items: start;
      }

      [data-showcase-anchor] {
        position: sticky;
        top: var(--blora-space-4);
      }

      [data-showcase-anchor-content] {
        max-height: 22rem;
        overflow: auto;
      }

      [data-showcase-anchor-content] > section {
        min-height: 18rem;
        scroll-margin-top: var(--blora-space-4);
      }

      [data-showcase-overlay-space] {
        min-height: 18rem;
      }

      [data-showcase-drawer-stage] {
        position: relative;
        min-height: 20rem;
        overflow: hidden;
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
      }

      [data-showcase-drawer-stage] > .blora-button {
        margin: var(--blora-space-4);
      }

      [data-showcase-mentions-stage] {
        min-height: 19rem;
        padding-bottom: 14rem;
      }

      [data-showcase-slide] {
        display: grid;
        min-height: 12rem;
        place-items: center;
        padding: var(--blora-space-6);
        color: var(--blora-color-text-primary);
        background: var(--blora-color-surface-raised);
      }

      [data-showcase-tile] {
        break-inside: avoid;
        margin-block-end: var(--blora-space-3);
        padding: var(--blora-space-4);
        color: var(--blora-color-text-primary);
        background: var(--blora-color-surface-raised);
        border-radius: var(--blora-radius-md);
      }

      [data-showcase-service] {
        display: grid;
        gap: var(--blora-space-3);
        justify-items: start;
      }

      @media (max-width: 900px) {
        :root {
          --showcase-navbar-offset: 5.5rem;
        }

        .showcase-catalog {
          width: min(calc(100% - var(--blora-space-6)), 58rem);
        }

        .showcase-heading {
          grid-template-columns: 1fr;
          align-items: start;
          padding-block-start: var(--blora-space-6);
        }
      }

      @media (max-width: 560px) {
        .showcase-preview,
        .showcase-code-panel {
          padding: var(--blora-space-4);
        }

        [data-showcase-anchor-layout] {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="blora-page blora-scope">
    <blora-navbar class="showcase-navbar" title="Blora Design" brand-href="#button" variant="floating">
      <blora-navbar-tool>
        <blora-palette-picker button-variant="ghost"></blora-palette-picker>
        <blora-color-scheme-toggle id="theme-toggle"></blora-color-scheme-toggle>
      </blora-navbar-tool>
      <blora-navbar-action label="规范文档" href="../../docs/standards.md"></blora-navbar-action>
      <blora-navbar-action label="开始使用" href="#button" variant="primary"></blora-navbar-action>
    </blora-navbar>

    <blora-sidebar-layout class="showcase-catalog" id="showcase-shell" variant="seamless" label="组件导航" toggle-label="组件导航" sticky>
      <blora-sidebar-layout-sidebar id="component-sidebar" label="组件导航">
        <p class="showcase-sidebar-title">Components</p>
        <div id="component-navigation-mount"></div>
      </blora-sidebar-layout-sidebar>

      <blora-sidebar-layout-content id="component-content">
        <div id="component-panel-root"></div>
      </blora-sidebar-layout-content>
    </blora-sidebar-layout>

    <div id="showcase-component-sources" hidden>
      <template data-component="button" data-label="Button" data-group="操作" data-eyebrow="Actions" data-kind="Native + CSS" data-description="原生按钮语义配合统一变体、尺寸、禁用与加载状态。">
        <div data-showcase-cases>
          <section data-showcase-case="Default"><h3>默认</h3><div data-showcase-row><button class="blora-button" type="button">保存</button></div></section>
          <section data-showcase-case="Variants"><h3>变体</h3><div data-showcase-row>
            <button class="blora-button" type="button" data-variant="primary">Primary</button>
            <button class="blora-button" type="button" data-variant="secondary">Secondary</button>
            <button class="blora-button" type="button" data-variant="outline">Outline</button>
            <button class="blora-button" type="button" data-variant="ghost">Ghost</button>
            <button class="blora-button" type="button" data-variant="danger">Danger</button>
            <button class="blora-button" type="button" data-variant="text">Text</button>
          </div></section>
          <section data-showcase-case="Sizes"><h3>尺寸</h3><div data-showcase-row>
            <button class="blora-button" type="button" data-size="xs">XS</button>
            <button class="blora-button" type="button" data-size="sm">Small</button>
            <button class="blora-button" type="button" data-size="md">Medium</button>
            <button class="blora-button" type="button" data-size="lg">Large</button>
            <button class="blora-button" type="button" data-size="xl">XLarge</button>
          </div></section>
          <section data-showcase-case="Disabled"><h3>禁用</h3><div data-showcase-row>
            <button class="blora-button" type="button" data-variant="primary" disabled>Primary</button>
            <button class="blora-button" type="button" data-variant="secondary" disabled>Secondary</button>
            <button class="blora-button" type="button" data-variant="outline" disabled>Outline</button>
            <button class="blora-button" type="button" data-variant="ghost" disabled>Ghost</button>
            <button class="blora-button" type="button" data-variant="danger" disabled>Danger</button>
          </div></section>
          <section data-showcase-case="Loading"><h3>加载</h3><div data-showcase-row>
            <button class="blora-button" type="button" data-variant="primary" data-loading aria-busy="true">Primary</button>
            <button class="blora-button" type="button" data-variant="secondary" data-loading aria-busy="true">Secondary</button>
            <button class="blora-button" type="button" data-variant="outline" data-loading aria-busy="true">Outline</button>
            <button class="blora-button" type="button" data-variant="danger" data-loading aria-busy="true">Danger</button>
          </div></section>
          <section data-showcase-case="ButtonGroup"><h3>按钮组</h3><div class="blora-button-group">
            <button class="blora-button" type="button" data-variant="outline">Left</button>
            <button class="blora-button" type="button" data-variant="outline">Center</button>
            <button class="blora-button" type="button" data-variant="outline">Right</button>
          </div></section>
        </div>
      </template>
      <template data-component="copy" data-label="Copy" data-group="操作" data-eyebrow="Actions" data-kind="Composite CE" data-description="复制文本并提供成功反馈的声明式组件。">
        <blora-copy text="pnpm add @bloret-crew/blora-design" label="复制安装命令"></blora-copy>
      </template>
      <template data-component="fab" data-label="FAB" data-group="操作" data-eyebrow="Actions" data-kind="CSS-only" data-description="适合页面主操作的浮动按钮视觉表面。">
        <div data-showcase-center>
          <button class="blora-fab blora-fab--static" type="button" aria-label="新建项目">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </template>
      <template data-component="speed-dial" data-label="Speed Dial" data-group="操作" data-eyebrow="Actions" data-kind="Composite CE" data-description="从主浮动按钮展开一组相关快捷操作。">
        <div class="blora-speed-dial-grid" data-showcase-case="AllVariants">
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">垂直 · 图标</p><blora-speed-dial label="新建"><blora-speed-dial-action value="camera" label="拍照" icon="camera"></blora-speed-dial-action><blora-speed-dial-action value="gallery" label="图库" icon="image"></blora-speed-dial-action><blora-speed-dial-action value="voice" label="语音" icon="mic"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">垂直 · 标签</p><blora-speed-dial label="快捷操作" action-appearance="label"><blora-speed-dial-action value="document" label="新建文档" icon="document-add"></blora-speed-dial-action><blora-speed-dial-action value="upload" label="上传文件" icon="upload"></blora-speed-dial-action><blora-speed-dial-action value="share" label="分享" icon="share"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">垂直 · 矩形按钮</p><blora-speed-dial label="项目操作" action-appearance="button"><blora-speed-dial-action value="new-project" label="新建项目"></blora-speed-dial-action><blora-speed-dial-action value="import" label="导入数据"></blora-speed-dial-action><blora-speed-dial-action value="export" label="导出报告"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">标签 · 关闭钮</p><blora-speed-dial label="编辑操作" action-appearance="label" close-button><blora-speed-dial-action value="edit" label="编辑" icon="pencil"></blora-speed-dial-action><blora-speed-dial-action value="copy" label="复制" icon="copy"></blora-speed-dial-action><blora-speed-dial-action value="delete" label="删除" icon="trash" variant="danger"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">标签 · 主操作</p><blora-speed-dial label="发布操作" action-appearance="label" main-label="发布" main-icon="arrow-up"><blora-speed-dial-action value="draft" label="草稿" icon="document"></blora-speed-dial-action><blora-speed-dial-action value="schedule" label="定时" icon="clock"></blora-speed-dial-action><blora-speed-dial-action value="preview" label="预览" icon="eye"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">水平 · 向左</p><blora-speed-dial label="联系操作" mode="left"><blora-speed-dial-action value="message" label="消息" icon="message"></blora-speed-dial-action><blora-speed-dial-action value="mail" label="邮件" icon="mail"></blora-speed-dial-action><blora-speed-dial-action value="phone" label="电话" icon="phone"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">花瓣 · 主操作</p><blora-speed-dial label="媒体操作" mode="flower" main-label="编辑" main-icon="pencil"><blora-speed-dial-action value="camera" label="拍照" icon="camera"></blora-speed-dial-action><blora-speed-dial-action value="chart" label="统计" icon="chart"></blora-speed-dial-action><blora-speed-dial-action value="gallery" label="图库" icon="image"></blora-speed-dial-action><blora-speed-dial-action value="voice" label="语音" icon="mic"></blora-speed-dial-action></blora-speed-dial></div>
          <div class="blora-speed-dial-stage"><p class="blora-speed-dial-stage__label">花瓣 · 纯展开</p><blora-speed-dial label="快捷入口" mode="flower"><blora-speed-dial-action value="home" label="首页" icon="home"></blora-speed-dial-action><blora-speed-dial-action value="search" label="搜索" icon="search"></blora-speed-dial-action><blora-speed-dial-action value="favorite" label="收藏" icon="star"></blora-speed-dial-action><blora-speed-dial-action value="theme" label="主题" icon="sun"></blora-speed-dial-action></blora-speed-dial></div>
        </div>
      </template>

      <template data-component="field" data-label="Field" data-group="数据输入" data-eyebrow="Data input" data-kind="Composite CE" data-description="统一管理标签、输入、提示、错误和字数限制。">
        <div data-showcase-stack>
          <blora-field label="文本输入" name="text-limit" value="这是一段用于演示超过二十个字符后自动标红的文本内容" hint="最长 20 个字符，超出部分会标红但不会截断输入。" limit="20" required></blora-field>
          <blora-field label="邮箱" name="email" type="email" value="invalid" error="请输入有效邮箱"></blora-field>
          <blora-field label="只读状态" name="disabled-field" value="不可编辑" disabled></blora-field>
        </div>

            return raw.replaceAll("\r\n", "\n").split("\n").map((line) => `${indent}${line.trimEnd()}`);
          }
          if (!(node instanceof Element)) return [];
          if (isShowcaseChrome(node)) {
            return [...node.childNodes].flatMap((child) => serializeNode(child, depth));
          }
          const tag = node.localName;
          const attributes = [...node.attributes]
            .filter((attribute) => !attribute.name.startsWith("data-showcase-"))
            .map((attribute) =>
              attribute.value === ""
                ? attribute.name
                : `${attribute.name}="${escapeAttribute(attribute.value)}"`,
            );
          const inline = `${indent}<${tag}${attributes.length ? ` ${attributes.join(" ")}` : ""}`;
          const pretty = attributes.length > 1 && inline.length > 88;
          const open = pretty
            ? [
                `${indent}<${tag}`,
                ...attributes.map((attribute, index) => {
                  const suffix = index === attributes.length - 1 ? ">" : "";
                  return `${indent}  ${attribute}${suffix}`;
                }),
              ]
            : [`${inline}>`];
          if (voidElements.has(tag)) return open;
          const childDepth = tag === "script" || tag === "style" ? 0 : depth + 1;
          const children = [...node.childNodes].flatMap((child) => serializeNode(child, childDepth));
          if (children.length === 0) {
            if (!pretty) return [`${inline}></${tag}>`];
            const last = open[open.length - 1];
            open[open.length - 1] = `${last.slice(0, -1)}></${tag}>`;
            return open;
          }
          const textOnly = node.children.length === 0;
          const singleLineText =
            !pretty && textOnly && children.length === 1 && !String(node.textContent || "").includes("\n");
          if (singleLineText) return [`${inline}>${children[0].trim()}</${tag}>`];
          return [...open, ...children, `${indent}</${tag}>`];
        }

        function sourceLines(template) {
          const lines = [...template.content.childNodes].flatMap((node) => serializeNode(node));
          const extra = sourceScripts[template.dataset.component];
          if (extra?.length) {
            if (lines.length) lines.push("");
            lines.push(...extra);
          }
          return lines;
        }

        function createElement(tag, attributes = {}, text = "") {
          const element = document.createElement(tag);
          for (const [name, value] of Object.entries(attributes)) {
            if (value !== undefined && value !== null) element.setAttribute(name, value);
          }
          if (text) element.textContent = text;
          return element;
        }

        function badgeVariant(kind) {
          if (kind.includes("CE")) return "success";
          if (kind === "Headless" || kind === "Service") return "info";
          return "neutral";
        }

        function revealCurrentNavigation(attempt = 0) {
          const componentSidebar = document.getElementById("component-sidebar");
          const current = componentNavigation.querySelector('[aria-current="page"]');
          if (
            !componentSidebar ||
            componentSidebar.localName !== "aside" ||
            !componentSidebar.contains(componentNavigation) ||
            !current
          ) {
            if (attempt < 60) {
              setTimeout(() => revealCurrentNavigation(attempt + 1), 50);
            }
            return;
          }
          const sidebarRect = componentSidebar.getBoundingClientRect();
          const currentRect = current.getBoundingClientRect();
          if (sidebarRect.height === 0) {
            if (attempt < 60) {
              setTimeout(() => revealCurrentNavigation(attempt + 1), 50);
            }
            return;
          }
          componentSidebar.scrollTop +=
            currentRect.top -
            sidebarRect.top -
            (sidebarRect.height - currentRect.height) / 2;
        }

        const componentNavigation = createElement("blora-sidebar-nav", {
          id: "component-navigation",
          label: "组件导航",
          value: "button",
        });

        const groupOrder = ["操作", "数据展示", "导航", "反馈", "数据输入", "布局", "样机"];
        const groups = new Map();
        for (const template of sourceTemplates) {
          const group = template.dataset.group;
          if (!groups.has(group)) groups.set(group, []);
          groups.get(group).push(template);
        }

        for (const label of [...groups.keys()].sort(
          (left, right) =>
            (groupOrder.indexOf(left) + 1 || 99) - (groupOrder.indexOf(right) + 1 || 99),
        )) {
          const templates = groups.get(label);
          const group = createElement("blora-sidebar-nav-group", { label });
          for (const template of templates) {
            group.append(
              createElement("blora-sidebar-nav-link", {
                label: template.dataset.label,
                href: `#${template.dataset.component}`,
                value: template.dataset.component,
              }),
            );
          }
          componentNavigation.append(group);
        }
        componentNavigationMount.replaceWith(componentNavigation);

        for (const template of sourceTemplates) {
          const name = template.dataset.component;
          const titleId = `${name}-basic-title`;
          const article = createElement("article", {
            class: "showcase-panel",
            id: `panel-${name}`,
            "data-component-panel": name,
          });
          if (name !== "button") article.hidden = true;

          const heading = createElement("header", { class: "showcase-heading" });
          const headingCopy = createElement("div");
          headingCopy.append(
            createElement("p", { class: "showcase-heading__eyebrow" }, template.dataset.eyebrow),
            createElement("h1", { tabindex: "-1" }, template.dataset.label),
            createElement(
              "p",
              { class: "showcase-heading__description" },
              template.dataset.description,
            ),
          );
          heading.append(
            headingCopy,
            createElement(
              "span",
              { class: "blora-badge", "data-variant": badgeVariant(template.dataset.kind) },
              template.dataset.kind,
            ),
          );

          const section = createElement("section", {
            class: "showcase-section",
            "aria-labelledby": titleId,
          });
          section.append(
            createElement("h2", { id: titleId }, "基础用法"),
            createElement(
              "p",
              { class: "showcase-section__description" },
              "下方 Preview 与 HTML 均来自同一份正式组件声明。",
            ),
          );

          const example = createElement("div", {
            class: "showcase-example",
            "data-example": name,
          });
          const tabs = createElement("blora-tabs", { flush: "" });
          const previewTab = createElement("blora-tab", {
            label: "Preview",
            value: "preview",
            selected: "",
          });
          previewTab.append(
            createElement("div", {
              class: "showcase-preview",
              id: `${name}-preview`,
              "data-preview-mount": name,
            }),
          );
          const codeTab = createElement("blora-tab", { label: "HTML", value: "html" });
          const codePanel = createElement("div", { class: "showcase-code-panel" });
          const mockup = createElement("blora-mockup", {
            id: `${name}-code`,
            variant: "code",
            label: `${template.dataset.label} HTML 示例`,
          });
          for (const line of sourceLines(template)) {
            mockup.append(createElement("blora-mockup-line", {}, line));
          }
          codePanel.append(mockup);
          codeTab.append(codePanel);
          tabs.append(previewTab, codeTab);
          example.append(tabs);
          section.append(example);
          article.append(heading, section);
          componentPanelRoot.append(article);
        }

        Blora.autoDefine();

        const componentPanels = [...document.querySelectorAll("[data-component-panel]")];
        const componentNames = new Set(componentPanels.map((panel) => panel.dataset.componentPanel));

        function hydratePanel(name) {
          const panel = document.querySelector(`[data-component-panel="${name}"]`);
          if (!panel || panel.dataset.hydrated === "true") return;
          const source = sourceTemplates.find((template) => template.dataset.component === name);
          const mount = panel.querySelector(`[data-preview-mount="${name}"]`);
          mount.append(source.content.cloneNode(true));
          panel.dataset.hydrated = "true";

          const resizePreview = () => {
            const previewRect = mount.getBoundingClientRect();
            let requiredBottom = previewRect.top;
            for (const element of mount.querySelectorAll("*")) {
              const style = getComputedStyle(element);
              if (style.display === "none" || style.visibility === "hidden") continue;
              requiredBottom = Math.max(requiredBottom, element.getBoundingClientRect().bottom);
            }
            const blockPadding = parseFloat(getComputedStyle(mount).paddingBottom) || 0;
            mount.style.minHeight = `${Math.max(288, Math.ceil(requiredBottom - previewRect.top + blockPadding))}px`;
          };
          const schedulePreviewResize = () => requestAnimationFrame(() => requestAnimationFrame(resizePreview));
          new ResizeObserver(schedulePreviewResize).observe(mount);
          new MutationObserver(schedulePreviewResize).observe(mount, {
            attributes: true,
            childList: true,
            subtree: true,
          });
          mount.addEventListener("click", schedulePreviewResize);
          mount.addEventListener("input", schedulePreviewResize);
          schedulePreviewResize();

          const messageTarget = mount.querySelector('[data-showcase-service="message"]');
          if (messageTarget) {
            messageTarget.append(
              Blora.createMessageElement({ content: "这是一条提示消息", type: "info" }),
              Blora.createMessageElement({ content: "操作已成功完成", type: "success" }),
              Blora.createMessageElement({ content: "请关注重要提示", type: "warning" }),
              Blora.createMessageElement({ content: "系统遇到了问题", type: "danger" }),
            );
          }
          const notificationTarget = mount.querySelector(
            '[data-showcase-service="notification"]',
          );
          if (notificationTarget) {
            const cards = [
              { type: "info", title: "新版本可用", description: "Blora Design 2.0 已准备就绪。" },
              { type: "success", title: "保存成功", description: "文档已保存至云端。" },
              { type: "warning", title: "存储空间不足", description: "剩余空间不足 1GB。" },
              { type: "danger", title: "同步失败", description: "请检查网络后重试。" },
            ].map((options) => Blora.createNotificationElement(options));
            notificationTarget.append(...cards);
            cards.forEach((card) => Blora.createNotificationController(card));
          }
          mount.querySelectorAll("[data-showcase-table]").forEach((table) => {
            const controller = Blora.createTableController(table);
            if (table.dataset.showcaseVirtual === "y") {
              controller.setRows(
                Array.from({ length: 500 }, (_, index) => [
                  `User ${index + 1}`,
                  index % 3 === 0 ? "Admin" : index % 3 === 1 ? "Editor" : "Guest",
                  index % 2 === 0 ? "Active" : "Offline",
                ]),
              );
            }
            if (table.dataset.showcaseVirtual === "both") {
              const keys = Array.from({ length: 40 }, (_, index) => `c${index}`);
              controller.setRows(
                Array.from({ length: 300 }, (_, rowIndex) =>
                  Object.fromEntries(keys.map((key, columnIndex) => [key, `R${rowIndex + 1}C${columnIndex + 1}`])),
                ),
                keys,
              );
            }
          });
          mount.querySelectorAll("[data-showcase-form]").forEach((form) => {
            Blora.createFormController(form);
            form.addEventListener("submit", (event) => event.preventDefault());
          });
          if (name === "effects") {
            mount.querySelectorAll("[data-blora-text-fx], [data-fx]").forEach((target) => {
              window.BloraEffects.textFx(
                target,
                target.getAttribute("data-blora-text-fx") || target.dataset.fx,
                { loop: true },
              );
            });
            mount.querySelectorAll("[data-showcase-text-rotate]").forEach((target) => window.BloraEffects.createTextRotateController(target));
            mount.querySelectorAll("[data-showcase-countdown]").forEach((target) => window.BloraEffects.createCountdownController(target));
            mount.querySelectorAll("[data-showcase-countup]").forEach((target) => window.BloraEffects.createCountUpController(target));
            mount.querySelectorAll("[data-showcase-image-diff]").forEach((target) => window.BloraEffects.createImageDiffController(target));
            mount.querySelectorAll("[data-showcase-hover-gallery]").forEach((target) => window.BloraEffects.createHoverGalleryController(target));
            mount.querySelectorAll("[data-showcase-watermark]").forEach((target) => window.BloraEffects.createWatermarkController(target));
            window.BloraEffects.initShortcutHints(mount);
          }
          if (name === "layout") {
            mount.querySelectorAll("[data-showcase-affix]").forEach((target) => window.BloraLayout.createAffixController(target));
            window.BloraLayout.initSmoothScroll(mount.ownerDocument);
            mount.querySelectorAll("[data-showcase-anchor]").forEach((target) => window.BloraLayout.createAnchorController(target));
          }
          if (name === "markdown") {
            const target = mount.querySelector("[data-blora-markdown], [data-showcase-markdown]");
            const script = target.querySelector("script[type='text/markdown']");
            const source = (script?.textContent || target.textContent || "").trim();
            window.BloraMarkdown.renderMarkdownTo(target, source);
          }
          if (name === "qrcode") {
            window.BloraQRCode.renderQRCode(
              mount.querySelector("[data-blora-qrcode], [data-showcase-qrcode]"),
              "https://blora.design/components",
              { size: 180 },
            );
          }
          if (name === "thread") {
            mount.querySelectorAll("[data-showcase-thread]").forEach((target) => window.BloraThread.createThreadController(target));
            mount.querySelectorAll(".blora-post__react-btn").forEach((button) => {
              if (!button.querySelector("svg") && typeof Blora.createBloraIcon === "function") {
                button.replaceChildren(Blora.createBloraIcon("smile", 18));
              }
            });
            mount.querySelectorAll(".blora-post__more").forEach((button) => {
              if (!button.querySelector("svg") && typeof Blora.createBloraIcon === "function") {
                button.replaceChildren(Blora.createBloraIcon("ellipsis", 16));
              }
            });
          }
        }

        function syncTheme() {
          const canvas = getComputedStyle(document.body).getPropertyValue("--blora-color-surface-canvas").trim();
          document.querySelector('meta[name="theme-color"]').setAttribute("content", canvas);
        }

        let preservedSidebarScrollTop = null;
        let navigationWasPointerDriven = false;

        function selectComponent(name, { focusHeading = false } = {}) {
          const next = componentNames.has(name) ? name : "button";
          const componentSidebar = document.getElementById("component-sidebar");
          const sidebarScrollTop = preservedSidebarScrollTop ?? componentSidebar?.scrollTop ?? 0;
          preservedSidebarScrollTop = null;
          const restoreSidebarScroll = () => {
            if (componentSidebar) componentSidebar.scrollTop = sidebarScrollTop;
          };
          hydratePanel(next);
          componentNavigation.value = next;
          restoreSidebarScroll();
          queueMicrotask(restoreSidebarScroll);
          requestAnimationFrame(restoreSidebarScroll);
          componentPanels.forEach((panel) => {
            panel.hidden = panel.dataset.componentPanel !== next;
          });
          const activePanel = document.querySelector(`[data-component-panel="${next}"]`);
          const title = activePanel.querySelector("h1");
          document.title = `${title.textContent} · Blora Design Components`;
          if (focusHeading) title.focus({ preventScroll: true });
        }

        componentPanelRoot.addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-showcase-action]");
          if (!trigger) return;
          const panel = trigger.closest("[data-component-panel]");
          const action = trigger.dataset.showcaseAction;
          const target = trigger.dataset.showcaseTarget
            ? panel.querySelector(`#${CSS.escape(trigger.dataset.showcaseTarget)}`)
            : null;
          if (action === "dialog") (target ?? panel.querySelector("blora-dialog"))?.show();
          if (action === "drawer") (target ?? panel.querySelector("blora-drawer"))?.open();
          if (action === "message") {
            const type = trigger.dataset.showcaseMessage;
            const content = {
              success: "操作成功",
              info: "这是一条提示",
              warning: "请注意",
              error: "出错了",
            }[type];
            Blora.message[type](content);
          }
          if (action === "close-overlay") trigger.closest("blora-dialog")?.close();
        });

        root.addEventListener("blora-theme-change", syncTheme);
        root.addEventListener("blora-color-scheme-change", syncTheme);

      componentNavigation.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        if (!event.target.closest('a[href^="#"]')) return;
        event.preventDefault();
          navigationWasPointerDriven = true;
          preservedSidebarScrollTop = document.getElementById("component-sidebar")?.scrollTop ?? 0;
        }, true);
        componentNavigation.addEventListener("blora-change", (event) => {
          history.pushState(null, "", `#${event.detail.value}`);
          selectComponent(event.detail.value, { focusHeading: !navigationWasPointerDriven });
          navigationWasPointerDriven = false;
        });
        new MutationObserver(() => {
          if (showcaseShell.hasAttribute("data-open")) {
            requestAnimationFrame(() => revealCurrentNavigation());
          }
        }).observe(showcaseShell, { attributeFilter: ["data-open"] });
        addEventListener("hashchange", () => selectComponent(location.hash.slice(1)));

        syncTheme();
        selectComponent(location.hash.slice(1));
        requestAnimationFrame(() => revealCurrentNavigation());
      })();
    </script>
  </body>
</html>
