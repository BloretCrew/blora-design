<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Verify v2 - tabs pills + checkbox</title>
    <link rel="stylesheet" href="packages/tokens/generated/tokens.css" />
    <link rel="stylesheet" href="packages/blora-design/src/components/tabs/tabs.css" />
    <link rel="stylesheet" href="packages/blora-design/src/components/checkbox/checkbox.css" />
    <style>
      body {
        font-family: var(--blora-font-sans);
        background: var(--blora-color-surface-canvas);
        color: var(--blora-color-text-primary);
        padding: 28px;
        font-size: 15px;
      }
      h2 {
        font-size: 14px;
        margin: 22px 0 10px;
        color: var(--blora-color-text-secondary);
        font-weight: 600;
      }
      .blora-tabs__panel {
        font-size: var(--blora-text-sm);
        color: var(--blora-color-text-secondary);
      }
    </style>
  </head>
  <body>
    <h2>Tabs · default</h2>
    <div class="blora-tabs">
      <div class="blora-tabs__nav" role="tablist">
        <button class="blora-tabs__tab" role="tab" aria-selected="true">概览</button>
        <button class="blora-tabs__tab" role="tab">活动</button>
        <button class="blora-tabs__tab" role="tab">设置</button>
      </div>
      <div class="blora-tabs__panel" role="tabpanel">概览内容区域</div>
    </div>

    <h2>Tabs · pills</h2>
    <div class="blora-tabs" data-variant="pills">
      <div class="blora-tabs__nav" role="tablist">
        <button class="blora-tabs__tab" role="tab" aria-selected="true">标签一</button>
        <button class="blora-tabs__tab" role="tab">标签二</button>
        <button class="blora-tabs__tab" role="tab">标签三</button>
      </div>
      <div class="blora-tabs__panel" role="tabpanel">标签一内容</div>
    </div>

    <h2>Checkbox</h2>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <label class="blora-checkbox"
        ><input type="checkbox" checked /><span class="blora-checkbox__box"></span
        >同意条款（checked）</label
      >
      <label class="blora-checkbox"
        ><input type="checkbox" /><span class="blora-checkbox__box"></span
        >接收通知（unchecked）</label
      >
      <label class="blora-checkbox" data-indeterminate
        ><input type="checkbox" /><span class="blora-checkbox__box"></span
        >部分选中（indeterminate）</label
      >
      <label class="blora-checkbox"
        ><input type="checkbox" checked disabled /><span class="blora-checkbox__box"></span
        >禁用选中（disabled）</label
      >
    </div>

    <script>
      // set native indeterminate for completeness
      document.querySelectorAll(".blora-checkbox[data-indeterminate] input").forEach((el) => {
        el.indeterminate = true;
      });
    </script>
  </body>
</html>
